apiVersion: apps/v1
kind: Deployment
metadata:
  # Must match keda-hpa.yaml's scaleTargetRef.name exactly.
  name: pulsestream-consumer-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsestream-consumer
  template:
    metadata:
      labels:
        app: pulsestream-consumer
    spec:
      containers:
        - name: consumer
          # Built locally via `docker-compose up --build` and loaded with
          # `kind load docker-image pulsestream-metrics-consumer:latest`.
          image: pulsestream-metrics-consumer:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/consumer.js"]
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: development
            - name: CONSUMER_PORT
              value: "3001"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/pulsestream
            - name: KAFKA_BROKERS
              value: redpanda:29092
---
apiVersion: v1
kind: Service
metadata:
  name: pulsestream-consumer
  namespace: default
spec:
  selector:
    app: pulsestream-consumer
  ports:
    - port: 3001
      targetPort: 3001
